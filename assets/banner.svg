<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 001</title>
  <desc>Naive retro hand-drawn editorial illustration with imperfect line, watercolour, gouache, pencil, pastel, warm paper, and five-language documentation.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9E8"/>
      <stop offset="0.55" stop-color="#F8F0D8"/>
      <stop offset="1" stop-color="#F1E4C9"/>
    </linearGradient>
    <pattern id="fibres" width="46" height="38" patternUnits="userSpaceOnUse">
      <path d="M2 8C8 6 13 7 20 5M29 29C34 27 39 28 45 25M8 35C13 33 18 34 22 31" stroke="#695C49" stroke-opacity="0.08" stroke-width="0.8"/>
      <circle cx="31" cy="12" r="0.8" fill="#B45B54" fill-opacity="0.08"/>
      <circle cx="15" cy="22" r="0.65" fill="#507F75" fill-opacity="0.08"/>
    </pattern>
    <filter id="wobble" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.055" numOctaves="1" seed="1" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="chalk" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.42" numOctaves="2" seed="3" result="grain"/>
      <feComposite in="grain" in2="SourceGraphic" operator="in" result="texture"/>
      <feBlend in="SourceGraphic" in2="texture" mode="multiply"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="400" rx="30"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#paper)"/>
    <rect width="1200" height="400" fill="url(#fibres)"/>
    <ellipse cx="1040" cy="95" rx="184" ry="126" fill="#E7B94D" fill-opacity="0.13"/>
    <ellipse cx="943" cy="356" rx="230" ry="92" fill="#6B9C8F" fill-opacity="0.11"/>
  </g>
  <rect x="22" y="22" width="1156" height="356" rx="22" stroke="#403A33" stroke-opacity="0.22" stroke-width="1.4" filter="url(#wobble)"/>
  <text x="1036" y="43" text-anchor="end" fill="#4C443C" fill-opacity="0.68" font-family="Arial, sans-serif" font-size="12" font-weight="700">中文 · EN · 日本語 · 한국어 ·</text>
  <text x="1128" y="43" text-anchor="end" direction="rtl" fill="#4C443C" fill-opacity="0.68" font-family="Arial, sans-serif" font-size="12" font-weight="700">العربية</text>
  <g>
    <path d="M74 68C125 62 213 64 273 70L270 98C213 95 127 100 73 94Z" fill="#35322D" filter="url(#wobble)"/>
    <text x="93" y="86" fill="#FFF9E8" font-family="Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2">XXD / IMAGE SKILL</text>
    <text x="70" y="165" fill="#302D29" font-family="Georgia, serif" font-size="65" font-weight="700" letter-spacing="-2">PANEL <tspan fill="#C8514C">001</tspan></text>
    <text x="72" y="210" fill="#4F7F74" font-family="Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="0.5">NAIVE LINE · RETRO PAPER · MIXED MEDIA</text>
    <text x="72" y="246" fill="#51493F" font-family="sans-serif" font-size="18" font-weight="650">稚拙线条 × 复古纸感 × 轻巧隐喻</text>
    <text x="72" y="273" fill="#51493F" fill-opacity="0.77" font-family="sans-serif" font-size="15" font-weight="600">素朴な手描き編集画 · 소박한 레트로 손그림</text>
  </g>
  <g>
    <path d="M72 304C113 298 170 300 216 304L213 345C167 341 112 347 73 343Z" fill="#FFF9E8" stroke="#3B3731" stroke-opacity="0.28" filter="url(#wobble)"/>
    <text x="92" y="330" fill="#302C28" font-family="Courier New, monospace" font-size="13" font-weight="700">SOURCE-BOUND</text>
    <path d="M228 304C271 301 321 300 359 306L356 344C316 341 268 346 228 342Z" fill="#C8514C" filter="url(#wobble)"/>
    <text x="249" y="330" fill="#FFF9E8" font-family="Courier New, monospace" font-size="13" font-weight="700">4 MODES</text>
    <path d="M371 305C427 299 500 302 548 307L545 345C495 341 426 347 370 343Z" fill="#4F7F74" filter="url(#wobble)"/>
    <text x="392" y="330" fill="#FFF9E8" font-family="Courier New, monospace" font-size="13" font-weight="700">WALLPAPER PACK</text>
  </g>
  <g transform="translate(885 198)">
    <path d="M-212 104C-157 56 -121 66 -76 19C-36 -24 22 -20 66 -58C104 -91 165 -97 223 -71C168 -54 147 -21 103 -2C58 17 28 62 -24 77C-84 94 -139 89 -201 123Z" fill="#E2B34B" fill-opacity="0.74" filter="url(#chalk)"/>
    <path d="M-195 117C-147 72 -104 84 -65 39C-32 1 22 8 62 -24C105 -59 153 -62 201 -43" stroke="#4F7F74" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 9" filter="url(#wobble)"/>
    <path d="M-48 65C-40 9 -17 -46 23 -69C54 -86 95 -77 113 -43C132 -6 111 35 76 62C39 90 -8 96 -48 65Z" fill="#D96A5F" fill-opacity="0.48" filter="url(#chalk)"/>
    <path d="M-30 73C-41 43 -34 1 -10 -26C12 -51 45 -59 73 -44C103 -28 113 8 96 37C75 72 28 91 -30 73Z" fill="#F6E8C8" fill-opacity="0.9"/>
    <path d="M-23 73C-35 39 -25 5 -4 -18C16 -39 47 -49 70 -35C94 -20 101 7 88 31C68 66 29 82 -23 73Z" stroke="#37332E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#wobble)"/>
    <path d="M10 -17C26 -6 38 8 46 27M-1 7C20 16 39 19 63 12M5 43C23 35 45 33 70 38" stroke="#4F7F74" stroke-width="2.3" stroke-linecap="round" filter="url(#wobble)"/>
    <circle cx="19" cy="-1" r="3.5" fill="#38342E"/>
    <path d="M-7 78C16 87 51 80 77 60" stroke="#B44E49" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 7"/>
    <path d="M-83 -40C-65 -66 -41 -82 -13 -88M-81 -28C-59 -49 -42 -59 -18 -66M129 49C151 39 172 23 192 4" stroke="#3B3731" stroke-opacity="0.45" stroke-width="1.7" stroke-linecap="round" filter="url(#wobble)"/>
    <path d="M-143 -19C-123 -10 -112 3 -107 22C-125 14 -140 14 -158 23C-155 4 -151 -8 -143 -19Z" fill="#587FA0" fill-opacity="0.76" filter="url(#chalk)"/>
    <path d="M143 -77C156 -66 162 -51 161 -34C148 -43 136 -45 122 -40C126 -57 132 -68 143 -77Z" fill="#C8514C" fill-opacity="0.72" filter="url(#chalk)"/>
  </g>
  <g transform="translate(690 309) rotate(-2)">
    <text x="0" y="0" fill="#4B443B" fill-opacity="0.7" font-family="Georgia, serif" font-size="11" font-style="italic" letter-spacing="1.1">A SMALL IMPERFECTION KEEPS THE MEMORY ALIVE / VOL.001</text>
    <path d="M1 12C110 8 257 15 382 10" stroke="#4B443B" stroke-opacity="0.28" stroke-width="1.3" filter="url(#wobble)"/>
    <text x="3" y="34" fill="#4B443B" fill-opacity="0.72" font-family="Georgia, serif" font-size="13" font-style="italic">drawn lightly, remembered clearly</text>
  </g>
</svg>
